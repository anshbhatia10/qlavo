  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            grotesk: ['Space Grotesk', 'sans-serif'],
          },

            zinc: {
              850: '#1f1f22',
              950: '#09090b',
            },
            emerald: {
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          },
          animation: {
            'spin-slow': 'spin 8s linear infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
            'float': 'float 6s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s linear infinite',
            'marquee': 'marquee 30s linear infinite',
            'gradient-shift': 'gradientShift 8s ease infinite',
          }
        }
      }
    }

  <style>
    :root {
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-glow: rgba(16, 185, 129, 0.15);
      --bg-primary: #030303;
      --bg-card: rgba(255, 255, 255, 0.03);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(16, 185, 129, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-primary);
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      cursor: default;
    }

    /* ── Custom Cursor ── */
    .custom-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--emerald);
      pointer-events: none;
      z-index: 99999;
      mix-blend-mode: difference;
      transition: transform 0.15s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
      transform: translate(-50%, -50%);
    }
    .custom-cursor.hovered {
      width: 60px;
      height: 60px;
      background: var(--emerald-bright);
      mix-blend-mode: difference;
    }
    .custom-cursor-trail {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.4);
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
    }

    /* ── Glass Panels ── */
    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
    }
    .glass-panel:hover {
      border-color: var(--border-hover);
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.08), 0 0 80px rgba(16, 185, 129, 0.04);
    }

    /* ── Bento Cards ── */
    .bento-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bento-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.06), 0 20px 60px rgba(0, 0, 0, 0.3);
      transform: translateY(-4px);
    }

    /* ── Gradient Text ── */
    .text-gradient {
      background: linear-gradient(to right, #fff, #71717a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-emerald {
      background: linear-gradient(135deg, #34d399, #10b981, #059669, #34d399);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 4s ease infinite;
    }

    /* ── Animated Gradient Shift ── */
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ── Grid Background ── */
    .bg-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Glow Effects ── */
    .bg-glow-emerald {
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
    }
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ── Buttons ── */
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #000;
      border-radius: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s ease;
    }
    .btn-primary:hover::before {
      left: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.35), 0 8px 30px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    /* ── Stat Numbers ── */
    .stat-number {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #34d399, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    /* ── Scroll Reveal Animations ── */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-left {
      opacity: 0;
      transform: translateX(-40px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-left.visible {
      opacity: 1;
      transform: translateX(0);
    }
    .reveal-right {
      opacity: 0;
      transform: translateX(40px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-right.visible {
      opacity: 1;
      transform: translateX(0);
    }
    .reveal-scale {
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-scale.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Entry Animations ── */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
    .animate-fade-in-up { animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* ── Marquee ── */
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 30s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }

    /* ── Shimmer Effect ── */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, transparent 0%, rgba(52, 211, 153, 0.08) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 2.5s linear infinite;
    }

    /* ── Typing Cursor ── */
    .typing-cursor::after {
      content: '▊';
      animation: blink 1s step-end infinite;
      color: var(--emerald-bright);
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ── Audit Input ── */
    .audit-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f4f4f5;
      font-size: 14px;
      font-weight: 300;
      outline: none;
      transition: all 0.3s ease;
    }
    .audit-input:focus {
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
      background: rgba(255, 255, 255, 0.06);
    }
    .audit-input::placeholder {
      color: #52525b;
    }

    /* ── 3D Tilt Card ── */
    .tilt-card {
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .tilt-card-inner {
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
    }

    /* ── Gradient Border ── */
    .gradient-border {
      position: relative;
    }
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(255,255,255,0.05), rgba(16,185,129,0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Selection ── */
    ::selection {
      background: var(--emerald);
      color: #000;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #333; }

    /* ── Canvas ── */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── Floating Badge ── */
    .floating-badge {
      animation: float 4s ease-in-out infinite;
    }

    /* ── Section Divider ── */
    .section-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(16,185,129,0.2), transparent);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .custom-cursor, .custom-cursor-trail { display: none; }
      .stat-number { font-size: 2.5rem; }
    }
  </style>
